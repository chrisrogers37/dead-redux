name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # Each check reports on its own, so one failure doesn't hide the others.
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: npm run lint
          - name: Type-check
            run: npx tsc --noEmit
          - name: Unit tests
            run: npm run test:run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}
