name: Screenshots

on:
  # Vercel posts a status for each deployment it builds.
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Site to shoot
        required: true
        default: https://dead-redux.vercel.app

permissions:
  contents: read

jobs:
  shoot:
    # Ready previews only; production is shot on demand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .github/screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps --only-shell chromium
      - run: node shoot.mjs
        env:
          SITE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
          OUT_DIR: ${{ runner.temp }}/screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
