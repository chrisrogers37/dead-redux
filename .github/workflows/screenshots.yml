name: Screenshots

on:
  # Vercel posts a status for each deployment it builds.
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Site to shoot
        required: true
        default: https://dead-redux.vercel.app

permissions:
  contents: read

env:
  # "true" makes the reduced-motion compare fail the run when its two stills differ.
  RM_COMPARE_ENFORCE: "true"

jobs:
  shoot:
    # Ready previews only; production is shot on demand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-24.04
    # Room for every shot and recording, the play steps' waits for archive.org's stream, and the MP4 conversion.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .github/screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install
      # The browser's system packages, fonts mostly, are kept between runs, since the Ubuntu mirror can take over ten minutes to serve
      # them. A run that restores them puts them where apt looks first, so apt installs them without downloading.
      - name: Restore the browser's system packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: playwright-apt-1.64.1-${{ runner.os }}-${{ runner.arch }}
      - run: |
          if compgen -G "$HOME/apt-archives/*.deb" > /dev/null; then sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/; fi
          npx playwright install --with-deps --only-shell chromium
          mkdir -p "$HOME/apt-archives"
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then cp /var/cache/apt/archives/*.deb "$HOME/apt-archives/"; fi
          echo "$(find "$HOME/apt-archives" -name '*.deb' | wc -l) packages kept"
      - name: Keep the browser's system packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: playwright-apt-1.64.1-${{ runner.os }}-${{ runner.arch }}
      # Playwright records video with its own ffmpeg.
      - run: npx playwright install ffmpeg
      - id: shoot
        run: node shoot.mjs
        env:
          SITE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
          OUT_DIR: ${{ runner.temp }}/screenshots
      # MP4 copies of the recordings play on phones. ffmpeg is the ffmpeg-static package's build, which npm install fetched from GitHub,
      # not apt's.
      - name: Convert recordings to MP4
        working-directory: ${{ runner.temp }}/screenshots
        run: |
          shopt -s nullglob
          ffmpeg=$(node -p 'require(process.argv[1])' "$GITHUB_WORKSPACE/.github/screenshots/node_modules/ffmpeg-static")
          for f in *.webm; do
            "$ffmpeg" -hide_banner -loglevel error -i "$f" \
              -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart "${f%.webm}.mp4"
          done
      # Writes its count to the job summary and its diff into the artifact; fails only when enforced.
      - name: Compare the reduced-motion stills
        id: compare
        run: |
          node compare.mjs \
            "$OUT_DIR/desktop-reduced-home-1.png" \
            "$OUT_DIR/desktop-reduced-home-2.png" \
            "$OUT_DIR/desktop-reduced-home-diff.png"
        env:
          OUT_DIR: ${{ runner.temp }}/screenshots
      # The integrity values a modulepreload link can pin for the world's two CDN files.
      - name: Print the CDN files' sha384
        continue-on-error: true
        # A stalled CDN fails this step quickly, and the upload below still runs.
        timeout-minutes: 1
        run: |
          set -o pipefail
          for u in \
            https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.min.js \
            https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/utils/BufferGeometryUtils.js; do
            h=$(curl -fsS --max-time 20 "$u" | openssl dgst -sha384 -binary | openssl base64 -A)
            echo "sha384-$h  $u" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      # Also runs when an enforced compare fails, so the shots and the diff are kept.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || steps.compare.outcome == 'failure'
        with:
          name: screenshots-${{ steps.shoot.outputs.host }}-${{ github.sha }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
