name: Screenshots

on:
  # Vercel posts a status for each deployment it builds.
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Site to shoot
        required: true
        default: https://dead-redux.vercel.app

permissions:
  contents: read

env:
  # "true" makes the reduced-motion compare fail the run when its two stills differ.
  RM_COMPARE_ENFORCE: "true"

jobs:
  shoot:
    # Ready previews only; production is shot on demand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-24.04
    # Room for every shot and recording, the play steps' waits for archive.org's stream and the MP4 conversion (a run takes about 20
    # minutes), and for the browser's system packages, which the Ubuntu mirror can take over ten minutes to serve. A job cut at its
    # limit uploads nothing, so the limit leaves room to spare.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: .github/screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      # ffmpeg-static's install script fetches ffmpeg from the package's GitHub release and checks no digest. This is the sha256 of the
      # b6.0 release's linux-x64 build; a different binary fails the run before anything uses it.
      - name: Check ffmpeg's sha256
        run: |
          echo "ed652b2f32e0851d1946894fb8333f5b677c1b2ce6b9d187910a67f8b99da028  node_modules/ffmpeg-static/ffmpeg" \
            | sha256sum --check --strict
      # The world's CDN files and the sha384 of each as three@0.185.0's npm package holds it: the world imports three.module.min.js and
      # BufferGeometryUtils.js, and three.module.min.js imports three.core.min.js. A file the CDN serves with another hash, or does not
      # serve, fails the run before the shoot loads it. These are the integrity values a modulepreload link can pin.
      - name: Check the CDN files' sha384
        timeout-minutes: 2
        run: |
          set -o pipefail
          failed=0
          while read -r want u; do
            got="sha384-$(curl -fsS --max-time 20 --retry 2 "$u" | openssl dgst -sha384 -binary | openssl base64 -A)" || got="nothing"
            if [ "$got" = "$want" ]; then verdict="matches"; else verdict="FAILS: the CDN served $got"; failed=1; fi
            echo "$want  $u  $verdict" | tee -a "$GITHUB_STEP_SUMMARY"
          done <<'EOF'
          sha384-QHQk1LzjJlJYNdthXjKCmffpDRZL3EqJ7LfqBzyKyvGgjAYM2ZVuYtFGg42NcAJ/ https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.min.js
          sha384-hVJglfJ4ExjEf/gZlu5Oiq3Zi9zgxOs4Kut5eM2Ts9j5xj0UcGQ6Np1eU3Qpw/5c https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.core.min.js
          sha384-05mkYituMJObxUkTK7xbW9SA45DEaxOge7FQUGrhW3dsFz0fckzykM6RMAPN26rD https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/utils/BufferGeometryUtils.js
          EOF
          exit "$failed"
      - run: npx playwright install --with-deps --only-shell chromium
      # Playwright records video with its own ffmpeg.
      - run: npx playwright install ffmpeg
      - id: shoot
        run: node shoot.mjs
        env:
          SITE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
          OUT_DIR: ${{ runner.temp }}/screenshots
      # MP4 copies of the recordings play on phones. ffmpeg is the ffmpeg-static package's build, which npm ci fetched from GitHub and
      # the step above checked, not apt's.
      - name: Convert recordings to MP4
        working-directory: ${{ runner.temp }}/screenshots
        run: |
          shopt -s nullglob
          ffmpeg=$(node -p 'require(process.argv[1])' "$GITHUB_WORKSPACE/.github/screenshots/node_modules/ffmpeg-static")
          for f in *.webm; do
            "$ffmpeg" -hide_banner -loglevel error -i "$f" \
              -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart "${f%.webm}.mp4"
          done
      # Writes its count to the job summary and its diff into the artifact; fails only when enforced.
      - name: Compare the reduced-motion stills
        id: compare
        run: |
          node compare.mjs \
            "$OUT_DIR/desktop-reduced-home-1.png" \
            "$OUT_DIR/desktop-reduced-home-2.png" \
            "$OUT_DIR/desktop-reduced-home-diff.png"
        env:
          OUT_DIR: ${{ runner.temp }}/screenshots
      # Fetches the manifest and each icon it lists, checks the declared sizes against the PNGs served, and asks Chrome whether the
      # site installs. Runs after a failed compare too; a failed check fails the run, and the upload below keeps the shots.
      - name: Check the install
        id: install
        if: success() || steps.compare.outcome == 'failure'
        run: node install.mjs
        env:
          SITE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
      # Also runs when the shoot's gate, an enforced compare or the install check fails, so the shots and the diff are kept.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || steps.shoot.outcome == 'failure' || steps.compare.outcome == 'failure' || steps.install.outcome == 'failure'
        with:
          name: screenshots-${{ steps.shoot.outputs.host }}-${{ github.sha }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
