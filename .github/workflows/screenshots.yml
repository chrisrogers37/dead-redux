name: Screenshots

on:
  # Vercel posts a status for each deployment it builds.
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Site to shoot
        required: true
        default: https://dead-redux.vercel.app

permissions:
  contents: read

env:
  # "true" makes the reduced-motion compare fail the run when its two stills differ.
  RM_COMPARE_ENFORCE: "false"

jobs:
  shoot:
    # Ready previews only; production is shot on demand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .github/screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps --only-shell chromium
      # Playwright records video with its own ffmpeg.
      - run: npx playwright install ffmpeg
      - id: shoot
        run: node shoot.mjs
        env:
          SITE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
          OUT_DIR: ${{ runner.temp }}/screenshots
      # MP4 copies of the recordings play on phones.
      - name: Convert recordings to MP4
        working-directory: ${{ runner.temp }}/screenshots
        run: |
          shopt -s nullglob
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          for f in *.webm; do
            ffmpeg -hide_banner -loglevel error -i "$f" \
              -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart "${f%.webm}.mp4"
          done
      # Writes its count to the job summary and its diff into the artifact; fails only when enforced.
      - name: Compare the reduced-motion stills
        id: compare
        run: |
          node compare.mjs \
            "$OUT_DIR/desktop-reduced-home-1.png" \
            "$OUT_DIR/desktop-reduced-home-2.png" \
            "$OUT_DIR/desktop-reduced-home-diff.png"
        env:
          OUT_DIR: ${{ runner.temp }}/screenshots
      # Also runs when an enforced compare fails, so the shots and the diff are kept.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || steps.compare.outcome == 'failure'
        with:
          name: screenshots-${{ steps.shoot.outputs.host }}-${{ github.sha }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
