name: Screenshots

on:
  # Vercel posts a status for each deployment it builds.
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Site to shoot
        required: true
        default: https://dead-redux.vercel.app

permissions:
  contents: read

env:
  # "true" makes the reduced-motion compare fail the run when its two stills differ.
  RM_COMPARE_ENFORCE: "true"

jobs:
  shoot:
    # Ready previews only; production is shot on demand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-24.04
    # The shoot runs as three jobs side by side, one for each shard (.github/screenshots/shards.mjs): the desktop's pages that act, the
    # desktop's pages that only look, and the rest, which is every other device, the recordings and the generated images. Each job
    # shoots its shard, checks what it shot and uploads it as an artifact of its own, named for the shard. The steps are the same in
    # each, but for the ones only `rest` has a use for: ffmpeg and the conversion to MP4, the reduced-motion compare and the install
    # check.
    strategy:
      # A shard that fails fails the run, and the others still shoot and upload theirs.
      fail-fast: false
      matrix:
        shard: [desktop-acts, desktop-looks, rest]
    # The limit. As one job the shoot took 55 minutes for main's world (98680e8) and 67 for the heaviest world shot so far (c9753ad),
    # both on 2026-11-23. By the second run's log its longest shard is `rest`: 24.2 minutes of pages and recordings, and 3.4 of set-up,
    # conversion, checks and upload, 27.6 in all. A slow runner takes 1.4 times as long (on the night of 2026-11-22 two runs took the
    # same 353 stills and recordings, one in 46.0 minutes and one in 64.8), which makes 38.6, and the browser's system packages, 70 s
    # in that run, can take over ten minutes when the Ubuntu mirror is slow, 9 more: 47.6. A job cut at its limit uploads nothing, so
    # the limit leaves 12 minutes over that for what later changes add to a shard.
    timeout-minutes: 60
    env:
      # The part of the shoot this job does: shoot.mjs reads it, and stops at a name that is no shard's.
      SHARD: ${{ matrix.shard }}
    defaults:
      run:
        working-directory: .github/screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The run's page shows the jobs' summaries one after another, so each starts with its shard's name.
      - name: Head the summary with the shard's name
        run: |
          echo "## Shard $SHARD" >> "$GITHUB_STEP_SUMMARY"
      # ffmpeg-static's install script, the only one among the shoot's packages (package-lock.json), fetches ffmpeg from the package's
      # GitHub release. Only the shard that records has a use for it, so the others install without running it: GitHub has refused
      # that fetch before, which fails the job, and each shard that made it would be one more chance of that.
      - if: matrix.shard == 'rest'
        run: npm ci
      - if: matrix.shard != 'rest'
        run: npm ci --ignore-scripts
      # That script checks no digest. This is the sha256 of the b6.0 release's linux-x64 build; a different binary fails the run before
      # anything uses it.
      - name: Check ffmpeg's sha256
        if: matrix.shard == 'rest'
        run: |
          echo "ed652b2f32e0851d1946894fb8333f5b677c1b2ce6b9d187910a67f8b99da028  node_modules/ffmpeg-static/ffmpeg" \
            | sha256sum --check --strict
      # Each CDN file the import map pins (src/lib/import-map.ts), fetched and checked against its pinned sha384, which is the hash of
      # that file in the three version's npm package. A file the CDN serves with another hash, or does not serve, fails the job before
      # the shoot loads it. Every shard checks, since every shard's pages load them, each from its own runner. The plain-Node hook lets
      # node import the module, as the maps workflow does.
      - name: Check the CDN files' sha384
        timeout-minutes: 2
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          pins=$(node --import ./scripts/resolve-ts.mjs --input-type=module -e '
            const { importMap } = await import("./src/lib/import-map.ts");
            for (const [url, digest] of Object.entries(importMap.integrity)) console.log(digest, url);
          ')
          if [ -z "$pins" ]; then
            echo "src/lib/import-map.ts pins no file" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          failed=0
          while read -r want u; do
            got="sha384-$(curl -fsS --max-time 10 --retry 2 "$u" | openssl dgst -sha384 -binary | openssl base64 -A)" || got="nothing"
            if [ "$got" = "$want" ]; then verdict="matches"; else verdict="FAILS: the CDN served $got"; failed=1; fi
            echo "$want  $u  $verdict" | tee -a "$GITHUB_STEP_SUMMARY"
          done <<<"$pins"
          exit "$failed"
      - run: npx playwright install --with-deps --only-shell chromium
      # Playwright records video with its own ffmpeg.
      - run: npx playwright install ffmpeg
      - id: shoot
        run: node shoot.mjs
        env:
          SITE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
          OUT_DIR: ${{ runner.temp }}/screenshots
      # MP4 copies of the recordings play on phones. ffmpeg is the ffmpeg-static package's build, which npm ci fetched from GitHub and
      # the step above checked, not apt's. Only `rest` records.
      - name: Convert recordings to MP4
        if: matrix.shard == 'rest'
        working-directory: ${{ runner.temp }}/screenshots
        run: |
          shopt -s nullglob
          ffmpeg=$(node -p 'require(process.argv[1])' "$GITHUB_WORKSPACE/.github/screenshots/node_modules/ffmpeg-static")
          for f in *.webm; do
            "$ffmpeg" -hide_banner -loglevel error -i "$f" \
              -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart "${f%.webm}.mp4"
          done
      # Writes each pair's count to the job summary and its diff into the artifact: the home page's, and the crowd's from ?pose=crowd. A
      # change in either fails the step only when enforced, once both are compared. The pairs are the desktop-reduced device's, which
      # `rest` shoots.
      - name: Compare the reduced-motion stills
        id: compare
        if: matrix.shard == 'rest'
        run: |
          echo "### Reduced-motion compare" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for page in home fixed-crowd; do
            node compare.mjs \
              "$OUT_DIR/desktop-reduced-$page-1.png" \
              "$OUT_DIR/desktop-reduced-$page-2.png" \
              "$OUT_DIR/desktop-reduced-$page-diff.png" || failed=1
          done
          exit "$failed"
        env:
          OUT_DIR: ${{ runner.temp }}/screenshots
      # Fetches the manifest and each icon it lists, checks the declared sizes against the PNGs served, and asks Chrome whether the
      # site installs. It checks the site and not the stills, so one shard runs it. Runs after a failed compare too; a failed check
      # fails the run, and the upload below keeps the shots.
      - name: Check the install
        id: install
        if: matrix.shard == 'rest' && (success() || steps.compare.outcome == 'failure')
        run: node install.mjs
        env:
          SITE_URL: ${{ github.event.deployment_status.environment_url || inputs.url }}
      # Also runs when the shoot's gate, an enforced compare or the install check fails, so the shots and the diff are kept. Each shard's
      # artifact has its name at the end, and `gh run download` makes a folder of each.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || steps.shoot.outcome == 'failure' || steps.compare.outcome == 'failure' || steps.install.outcome == 'failure'
        with:
          name: screenshots-${{ steps.shoot.outputs.host }}-${{ github.sha }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error
          # A re-run of one failed shard replaces the artifact its earlier attempt uploaded, as the maps workflow's does.
          overwrite: true
