name: Maps

# A map of each featured show for the world's third layer (public/world/maps.js), made ahead of its day from the recording the
# page plays. Untrusted media goes through ffmpeg, so the work is split: analyse can only read the repo, and publish, the one job
# that can push, only checks the maps before it commits them. The scripts run on Node alone; analyse installs Ubuntu's ffmpeg,
# from a weekly cache of its signed packages, or from Ubuntu's mirror when the cache can't supply them.
on:
  schedule:
    # Daily: the earliest maps among the next 14 featured days that are missing or made from a recording the page no longer
    # plays, at most 2 a run.
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: A show date (YYYY-MM-DD) to map. Empty maps the next featured days that have no map of the recording the page plays.
        required: false
        default: ""
      branch:
        description: The branch the maps are committed to. Empty means maps.
        required: false
        default: ""
      site:
        description: The site whose /api/playing route names the recording each page plays, such as a branch's preview. Empty means production.
        required: false
        default: ""

permissions: {}

concurrency:
  # One run at a time per target branch, so two publishes never race.
  group: maps-${{ inputs.branch || 'maps' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  analyse:
    runs-on: ubuntu-24.04
    # Two shows of about 180 MB each, fetched one request at a time and decoded as they arrive.
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      made: ${{ steps.analyse.outputs.made }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # A cache entry holds Ubuntu's packages for ffmpeg on one runner image, which fixes the packages ffmpeg needs, for one ISO
      # week, which bounds how far a cached ffmpeg lags Ubuntu's updates. Only that exact key is restored.
      - name: Key the package cache
        id: cache-key
        run: echo "key=ffmpeg-$ImageOS-$ImageVersion-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ runner.temp }}/ffmpeg-packages
          key: ${{ steps.cache-key.outputs.key }}
      # Ubuntu's ffmpeg and the packages it needs that the runner lacks. A hit installs them with no request to the mirror, once
      # every cached file passes from_cache's checks; a miss, or a hit that fails one, installs from the mirror. A stalled mirror
      # fails this step, not the whole job's time.
      - name: Install ffmpeg
        id: install
        timeout-minutes: 10
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
          PACKAGES: ${{ runner.temp }}/ffmpeg-packages
        run: |
          shopt -s nullglob
          # Ubuntu's archive key, from the runner image: the cache never supplies one.
          keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg
          warn() { echo "::warning::$1, so ffmpeg comes from the mirror."; }
          # The cache holds lists/, each Ubuntu suite's InRelease and Packages indexes, and debs/, the .debs apt fetched for
          # ffmpeg, all under apt's own names. A hit installs only what those signed indexes list, with the updates and security
          # suites signed in the last ten days. apt itself only compares a cached .deb's size with its index, so the checks here
          # hash every file.
          from_cache() {
            local signed releases indexes debs release index name suite path sum codename files file date signed_at deb unnamed
            signed=$(mktemp -d)
            releases=("$PACKAGES"/lists/*_InRelease)
            indexes=("$PACKAGES"/lists/*_Packages)
            debs=("$PACKAGES"/debs/*.deb)
            # Each InRelease has a good signature from that key and is named for the suite it signs.
            for release in "${releases[@]}"; do
              name=${release##*/}
              gpgv --keyring "$keyring" --output "$signed/$name" "$release" 2>/dev/null ||
                { warn "$name has no good signature from Ubuntu's archive key"; return 1; }
              suite=$(sed -n 's/^Suite: //p' "$signed/$name")
              [[ $name == *_dists_"$suite"_InRelease ]] || { warn "$name signs the suite $suite"; return 1; }
            done
            # Each Packages index has the SHA256 its suite's InRelease lists for it.
            for index in "${indexes[@]}"; do
              name=${index##*/}
              release=${name%_*_*_Packages}_InRelease
              path=${name#"${release%InRelease}"}
              sum=$(awk -v path="${path//_//}" '/^[^ ]/ { sha = $1 == "SHA256:" } sha && $3 == path { print $1 }' "$signed/$release" 2>/dev/null)
              if [ -z "$sum" ] || ! sha256sum --status -c <<< "$sum  $index"; then
                warn "$name doesn't match its InRelease"; return 1
              fi
            done
            # The updates and security suites are both there, with every Packages index the runner's sources read for them, and
            # each was signed under ten days ago. (apt also names a binary-all index, which only a suite whose InRelease lists the
            # architecture "all" has, and Ubuntu's don't.)
            codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
            for suite in "$codename-updates" "$codename-security"; do
              # shellcheck disable=SC2016
              files=$(apt-get indextargets --no-release-info --format '$(ARCHITECTURE) $(FILENAME)' "Release: $suite" \
                'Created-By: Packages' | awk '$1 != "all" { print $2 }')
              [ -n "$files" ] || { warn "the runner's sources read no $suite"; return 1; }
              for file in $files; do
                [ -f "$PACKAGES/lists/${file##*/}" ] || { warn "the cache has no ${file##*/}"; return 1; }
              done
              release=${file##*/}
              date=$(sed -n 's/^Date: //p' "$signed/${release%_*_*_Packages}_InRelease" 2>/dev/null)
              signed_at=$(date -d "${date:-@0}" +%s 2>/dev/null) || signed_at=0
              if (( signed_at <= $(date +%s) - 10 * 86400 )); then
                warn "$suite was signed ${date:-at no known date}, ten days ago or more"; return 1
              fi
              echo "$suite: signed $date"
            done
            # Each .deb has the SHA256 of a record in those indexes and already has the name apt gives that record's .deb:
            # Package_Version_Architecture.deb, with any ":" in the version written %3a.
            [ ${#debs[@]} -gt 0 ] || { warn "the cache has no .debs"; return 1; }
            for deb in "${debs[@]}"; do sum=$(sha256sum < "$deb"); echo "${sum%% *} ${deb##*/}"; done > "$signed/debs"
            awk -v debs="$signed/debs" '
              BEGIN { while ((getline line < debs) > 0) { split(line, f, " "); name[f[1]] = f[2] } RS = ""; FS = "\n" }
              {
                pkg = ver = arch = sum = ""
                for (i = 1; i <= NF; i++)
                  if ($i ~ /^Package: /) pkg = substr($i, 10)
                  else if ($i ~ /^Version: /) ver = substr($i, 10)
                  else if ($i ~ /^Architecture: /) arch = substr($i, 15)
                  else if ($i ~ /^SHA256: /) sum = substr($i, 9)
                gsub(/:/, "%3a", ver)
                if (sum in name && name[sum] == pkg "_" ver "_" arch ".deb") print name[sum]
              }' "${indexes[@]}" | sort -u > "$signed/named"
            unnamed=$(cut -d' ' -f2 "$signed/debs" | sort -u | comm -23 - "$signed/named")
            [ -z "$unnamed" ] || { warn "no index names ${unnamed%%$'\n'*} with its SHA256"; return 1; }
            echo "Every cached file passes: ${#releases[@]} InRelease files, ${#indexes[@]} Packages indexes and ${#debs[@]} .debs."
            sudo cp "${releases[@]}" "${indexes[@]}" /var/lib/apt/lists/
            sudo cp "${debs[@]}" /var/cache/apt/archives/
            sudo apt-get install -y -q --no-download ffmpeg || { warn "apt couldn't install ffmpeg from the cached packages"; return 1; }
          }
          if command -v ffmpeg >/dev/null; then
            echo "The runner has ffmpeg."
          elif [ "$HIT" = true ] && from_cache; then
            echo "Installed ffmpeg from the cache."
          else
            # apt fetches into a directory of its own, so the .debs there are the ones this install needed.
            sudo mkdir -p /var/cache/apt/ffmpeg
            sudo apt-get update -q
            sudo apt-get install -y -q -o Dir::Cache::Archives=/var/cache/apt/ffmpeg/ ffmpeg
            if [ "$HIT" != true ]; then
              # For the save: the InRelease and Packages indexes of each suite Ubuntu's archive key signs, and those .debs.
              mkdir -p "$PACKAGES/lists" "$PACKAGES/debs"
              for release in /var/lib/apt/lists/*_InRelease; do
                if gpgv --keyring "$keyring" "$release" 2>/dev/null; then
                  cp "$release" "${release%InRelease}"*_Packages "$PACKAGES/lists/"
                fi
              done
              cp /var/cache/apt/ffmpeg/*.deb "$PACKAGES/debs/"
              lists=("$PACKAGES"/lists/*) debs=("$PACKAGES"/debs/*)
              echo "Kept ${#lists[@]} lists and ${#debs[@]} .debs for the cache."
              echo "save=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "ffmpeg: $(command -v ffmpeg)"
      # Saved right after a miss's install, before any step reads a recording. A hit's key already has its entry.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.install.outputs.save == 'true'
        with:
          path: ${{ runner.temp }}/ffmpeg-packages
          key: ${{ steps.cache-key.outputs.key }}
      - name: Pick the shows
        id: pick
        # Asking the site what each mapped show's page plays takes seconds; a site that hangs fails this step, not the whole job's time.
        timeout-minutes: 10
        env:
          DATE: ${{ inputs.date }}
          SITE: ${{ inputs.site }}
        run: |
          if [ -n "$DATE" ]; then
            if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::Not a show date: $DATE"
              exit 1
            fi
            echo "shows=$DATE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A show has a map when public/maps/<show date>.json is on main or on the maps branch.
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          # ls-remote exits 2 for a missing branch, which is normal before the first run; any other failure stops the step, so a
          # failed read never passes for "no maps yet". The full ref name, because a bare "maps" also matches a branch like feat/maps.
          ls_status=0
          git ls-remote --exit-code origin refs/heads/maps >/dev/null || ls_status=$?
          case "$ls_status" in
            0) git fetch --no-tags --depth=1 origin +refs/heads/maps:refs/remotes/origin/maps ;;
            2) echo "No maps branch yet." ;;
            *)
              echo "::error::Could not read the maps branch: git ls-remote exited $ls_status"
              exit "$ls_status"
              ;;
          esac
          # Each branch's maps are unpacked into have/, the maps branch's after main's: of a show both have, the maps branch holds
          # the newer map.
          mkdir -p "$RUNNER_TEMP/have"
          for ref in origin/main origin/maps; do
            if git rev-parse --verify -q "$ref" >/dev/null && [ -n "$(git ls-tree "$ref" public/maps)" ]; then
              git archive "$ref" public/maps | tar -x -C "$RUNNER_TEMP/have" --strip-components=2
            fi
          done
          # featured-on.mjs imports the site's own schedule. Node strips the types; the hook resolves the imports. It asks the same
          # site as Analyse what the page plays for each mapped show, and picks a show again whose map was made from another
          # recording.
          site=()
          if [ -n "$SITE" ]; then site=(--site "$SITE"); fi
          node --import ./scripts/resolve-ts.mjs scripts/featured-on.mjs --days 14 --limit 2 --maps "$RUNNER_TEMP/have" "${site[@]}" \
            > "$RUNNER_TEMP/shows.txt"
          echo "shows=$(tr '\n' ' ' < "$RUNNER_TEMP/shows.txt")" >> "$GITHUB_OUTPUT"
      - name: Analyse
        id: analyse
        if: steps.pick.outputs.shows != ''
        env:
          SHOWS: ${{ steps.pick.outputs.shows }}
          OUT_DIR: ${{ runner.temp }}/maps
          SITE: ${{ inputs.site }}
        run: |
          mkdir -p "$OUT_DIR"
          status=0
          # The site's /api/playing route names what each page plays; without a site input the script reads production.
          site=()
          if [ -n "$SITE" ]; then site=(--site "$SITE"); fi
          # One word per show date. A show that fails is logged and the others still run; the job fails after the upload.
          # shellcheck disable=SC2086
          node scripts/analyse-show.mjs --out "$OUT_DIR" "${site[@]}" $SHOWS || status=$?
          made=$(find "$OUT_DIR" -maxdepth 1 -name '*.json' -printf '%f\n' | sed 's/\.json$//' | sort | tr '\n' ' ')
          echo "made=$made" >> "$GITHUB_OUTPUT"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.analyse.outputs.made != '' }}
        with:
          name: maps-${{ github.run_id }}
          path: ${{ runner.temp }}/maps/*.json
          if-no-files-found: error
          retention-days: 7
          # A re-run of this job replaces the earlier attempt's artifact, and a re-run of publish alone still finds it by this name.
          overwrite: true

  publish:
    needs: analyse
    # Publishes what analyse made, even when another show in the run failed.
    if: ${{ !cancelled() && needs.analyse.outputs.made != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The checker comes from this run's own commit; the maps go onto the target branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: site
          # Every branch, so the target branch's tip is there to add the maps to.
          fetch-depth: 0
          persist-credentials: false
      - name: Switch to the branch
        id: branch
        working-directory: site
        env:
          BRANCH_INPUT: ${{ inputs.branch }}
        run: |
          branch="${BRANCH_INPUT:-maps}"
          # Maps go to the maps branch or to a pull request's branch, never straight to main.
          case "$branch" in
            main | HEAD | refs/* | -*)
              echo "::error::Maps are not committed to $branch."
              exit 1
              ;;
          esac
          if ! git check-ref-format --branch "$branch" >/dev/null; then
            echo "::error::Not a branch name: $branch"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The job only adds commits of maps on top of the branch; it never merges or rebases. A push by the job's token may not
          # change a workflow file, and a merge of main would carry main's workflow changes into the push. The maps branch starts
          # from main when it is missing, so once its pull request merges, deleting the branch lets the next run start it again.
          if git rev-parse --verify -q "refs/remotes/origin/$branch" >/dev/null; then
            git checkout -q -B "$branch" "origin/$branch"
          elif [ "$branch" = maps ]; then
            git checkout -q -b maps origin/main
          else
            echo "::error::There is no branch $branch."
            exit 1
          fi
          echo "name=$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maps-${{ github.run_id }}
          path: ${{ runner.temp }}/incoming
      - name: Check the maps and add them
        run: node tools/scripts/check-maps.mjs "$RUNNER_TEMP/incoming" site/public/maps
      - name: Commit and push
        working-directory: site
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          MADE: ${{ needs.analyse.outputs.made }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/maps
          if git diff --cached --quiet; then
            echo "These maps are already on $BRANCH."
            exit 0
          fi
          git commit -q -m "maps: add ${MADE% }"
          # The checkouts keep no token, so the push carries it in its URL and git's config never holds it.
          git push "https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "Pushed $(git rev-parse HEAD) to $BRANCH."
