name: Landmark placement checks

on:
  push:
    branches: [scratch/landmarks-checks-82]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: three 0.185.0
        run: bash .github/scratch/landmarks/fetch_three.sh
      - name: The world files of main, of the earlier head and of the current head
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"
          git fetch --no-tags origin refs/pull/82/head
          test "$(git rev-parse FETCH_HEAD)" = 682b7d8c5688bff4e076d6e28320968db5a15b6b
          git archive 697e8b6896f4d173043e75b11957c581c3c8276a public/world | tar -x -C "$RUNNER_TEMP/base"
          git archive 43a16abe830740f72507ea1d94cb01723e04739c public/world | tar -x -C "$RUNNER_TEMP/old"
          git archive 682b7d8c5688bff4e076d6e28320968db5a15b6b public/world | tar -x -C "$RUNNER_TEMP/new"
          for d in base old new; do sha256sum "$RUNNER_TEMP/$d/public/world/collide.js"; done
      - name: The earlier head against the current head
        env:
          BENCH_KIT: ${{ github.workspace }}/.github/scratch/landmarks
          BENCH_TMP: ${{ runner.temp }}/bench
          BENCH_THREE_DIR: ${{ runner.temp }}/three
          BENCH_BASE_WORLD: ${{ runner.temp }}/old/public/world
          BENCH_HEAD_WORLD: ${{ runner.temp }}/new/public/world
          BENCH_FIXED_DAY: ${{ github.workspace }}/.github/scratch/landmarks/fixed_day.json
          BENCH_OUT: ${{ github.workspace }}/bench-out/variant
        run: |
          set -o pipefail
          mkdir -p "$BENCH_OUT" "$BENCH_TMP"
          node --version
          python3 --version
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          python3 .github/scratch/landmarks/bench.py variant 2>&1 | tee "${{ github.workspace }}/bench-out/variant.txt"
      - name: The current head against main
        if: always()
        continue-on-error: true
        env:
          BENCH_KIT: ${{ github.workspace }}/.github/scratch/landmarks
          BENCH_TMP: ${{ runner.temp }}/bench-all
          BENCH_THREE_DIR: ${{ runner.temp }}/three
          BENCH_BASE_WORLD: ${{ runner.temp }}/base/public/world
          BENCH_HEAD_WORLD: ${{ runner.temp }}/new/public/world
          BENCH_FIXED_DAY: ${{ github.workspace }}/.github/scratch/landmarks/fixed_day.json
          BENCH_OUT: ${{ github.workspace }}/bench-out/all
        run: |
          set -o pipefail
          mkdir -p "$BENCH_OUT" "$BENCH_TMP"
          python3 .github/scratch/landmarks/bench.py all 2>&1 | tee "${{ github.workspace }}/bench-out/all.txt"
      - name: Summary
        if: always()
        run: |
          for f in variant all; do
            if [ -f "bench-out/$f.txt" ]; then
              { echo "## $f"; echo '```'; head -c 400000 "bench-out/$f.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: landmark-checks-${{ github.sha }}
          path: bench-out
