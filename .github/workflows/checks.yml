# One-off run of the branch's lint, type-check and unit tests on a runner, as CI runs them on a pull request. It lives only on its
# scratch branch, which is never merged, and runs when this file is pushed there.
name: Checks (scratch)

on:
  push:
    branches: [scratch/walk-peak-checks]
    paths:
      - .github/workflows/checks.yml

permissions: {}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Each check after lint runs even when an earlier one failed, so one run reports them all.
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npx tsc --noEmit
        if: ${{ !cancelled() }}
      - run: npm run test:run
        if: ${{ !cancelled() }}
